# Optional CouchDB peer gateway; never included by the base stack.
# Supply a matching DNS name, PEM certificate chain and private key locally.
services:
  gateway:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    entrypoint: [/bin/sh, /gateway/start.sh]
    user: "${LOKLM_UID:-1000}:${LOKLM_GID:-1000}"
    environment:
      LOKLM_TLS_HOST: ${LOKLM_TLS_HOST:?Set the DNS hostname present in the TLS certificate}
    volumes:
      - type: bind
        source: ./gateway/start.sh
        target: /gateway/start.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./gateway/nginx.conf.template
        target: /gateway/nginx.conf.template
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LOKLM_TLS_CERT_FILE:?Set absolute path to the operator PEM certificate chain}
        target: /run/tls/fullchain.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LOKLM_TLS_KEY_FILE:?Set absolute path to the private operator PEM key}
        target: /run/tls/privkey.pem
        read_only: true
        bind: {create_host_path: false}
    ports:
      - target: 8443
        published: "${LOKLM_TLS_PORT:-8443}"
        host_ip: ${LOKLM_TLS_BIND:-127.0.0.1}
        protocol: tcp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    restart: unless-stopped
    networks: [private, gateway]
    depends_on:
      couchdb: {condition: service_healthy}
networks:
  gateway: {}
