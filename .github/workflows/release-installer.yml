name: Release installer

# Full, immutable releases only. Builders have no object-store credentials.
# Failed uploads remain unadvertised; a partially uploaded version is not reused.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable X.Y.Z, equal to package.json; all platforms are required'
        required: true
        type: string

concurrency:
  group: release-installer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate version, wizard version and public base
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLIC_INSTALLER_BASE_URL: ${{ secrets.PUBLIC_INSTALLER_BASE_URL }}
        run: node scripts/release-preflight.mjs
      - name: Require reviewed commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  checks:
    needs: preflight
    uses: ./.github/workflows/checks.yml

  build-windows:
    needs: [preflight, checks]
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      PUBLIC_INSTALLER_BASE_URL: ${{ secrets.PUBLIC_INSTALLER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/release-preflight.mjs
      - run: pnpm install --frozen-lockfile
      # A release cannot ignore a failed native build as developer postinstall can.
      - run: pnpm exec electron-rebuild -f -o argon2,better-sqlite3-multiple-ciphers
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-wizard/src-tauri
      - run: cargo install tauri-cli --version '^2.0' --locked
      - run: choco install nsis -y --no-progress
      - name: Test native Windows installer recovery and extraction
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked
      - run: pnpm package:win:payload
      - name: Sign app with existing configured certificate, when available
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/sign-release-windows.ps1 -Path release/win-unpacked/LokLM.exe
      - name: Packaged persistence, restart and shutdown smoke
        env:
          LOKLM_PACKAGED_EXE: ${{ github.workspace }}/release/win-unpacked/LokLM.exe
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/packaged-windows.spec.ts --retries=0 --reporter=list
      - run: pnpm package:win:archive
      - run: Copy-Item installer-wizard/payload-manifest.json release/manifest-windows.json
      - run: pnpm package:win:wizard
      - name: Sign wizard before embedding
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/sign-release-windows.ps1 -Path installer-wizard/src-tauri/target/release/loklm.exe
      - run: pnpm package:win:stub
      - name: Sign outer installer before hashing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/sign-release-windows.ps1 -Path release/LokLM-x64.exe
      - run: node scripts/release-artifacts.mjs stamp windows
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/LokLM-x64.exe*
            release/payload-win-x64.tar.zst*
            release/cuda-win-x64.tar.zst*
            release/manifest-windows.json

  build-linux:
    needs: [preflight, checks]
    # Preserve the glibc floor for Ubuntu22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      PUBLIC_INSTALLER_BASE_URL: ${{ secrets.PUBLIC_INSTALLER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/release-preflight.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-rebuild -f -o argon2,better-sqlite3-multiple-ciphers
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf makeself fakeroot xvfb libnss3 libasound2 libgbm1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-wizard/src-tauri
          key: ubuntu-22.04
      - run: |
          if cargo tauri --version; then
            cargo install tauri-cli --version '^2.0' --locked
          else
            cargo install tauri-cli --version '^2.0' --locked --force
          fi
      - name: Test native Linux installer recovery and extraction
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked
      - name: Test GLib iterator backport with optimizations enabled
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked --release --test glib_variant_iter
      - run: pnpm package:linux
      - name: Packaged Linux persistence, restart and shutdown smoke
        env:
          LOKLM_PACKAGED_EXE: ${{ github.workspace }}/release/linux-unpacked/loklm
        run: xvfb-run -a pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/packaged-windows.spec.ts --retries=0 --reporter=list
      - run: cp installer-wizard/payload-manifest.json release/manifest-linux.json
      - name: Validate Debian package version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: test "$(dpkg-deb --field release/LokLM-Setup-linux-x64.deb Version)" = "$RELEASE_VERSION"
      - run: node scripts/release-artifacts.mjs stamp linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/LokLM-Setup-linux-x64.run*
            release/LokLM-Setup-linux-x64.deb*
            release/payload-linux-x64.tar.zst*
            release/cuda-linux-x64.tar.zst*
            release/manifest-linux.json

  build-mac-payload:
    needs: [preflight, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-rebuild -f -o argon2,better-sqlite3-multiple-ciphers
      - name: Test real framework symlink preservation on the native filesystem
        run: pnpm exec vitest run --project scripts tests/unit/scripts/build-payload-archive.test.mjs tests/unit/scripts/release-safety.test.mjs
      - run: pnpm tessdata
      - run: pnpm build
      # Refuses cross-building; verifies executable and native-addon architectures.
      - run: node scripts/build-mac-payloads.mjs ${{ matrix.arch }}
      - name: Packaged native Mac persistence, restart and shutdown smoke
        env:
          LOKLM_PACKAGED_EXE: ${{ github.workspace }}/release/mac-${{ matrix.arch }}/LokLM.app/Contents/MacOS/LokLM
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/packaged-windows.spec.ts --retries=0 --reporter=list
      - run: node scripts/build-payload-archive.mjs mac-${{ matrix.arch }}
      - name: Verify delivered archive preserves bundle signatures and architecture
        run: node scripts/verify-mac-payload-archive.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: release/payload-mac-${{ matrix.arch }}.tar.zst*

  build-macos:
    needs: [preflight, build-mac-payload]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      PUBLIC_INSTALLER_BASE_URL: ${{ secrets.PUBLIC_INSTALLER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-mac-*
          path: release
          merge-multiple: true
      - run: node scripts/write-payload-manifest.mjs
      - run: cp installer-wizard/payload-manifest.json release/manifest-macos.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-wizard/src-tauri
          key: macos-universal
      - run: cargo install tauri-cli --version '^2.0' --locked
      # Developer ID signing/notarization is not configured by this workflow.
      - name: Test native Mac installer recovery and extraction
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked
      - run: node scripts/build-installer-dmg.mjs
      - run: node scripts/release-artifacts.mjs stamp macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/LokLM-mac.dmg*
            release/manifest-macos.json

  publish:
    needs: [preflight, checks, build-windows, build-linux, build-mac-payload, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      PUBLIC_INSTALLER_BASE_URL: ${{ secrets.PUBLIC_INSTALLER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify complete artifact set against exact baked manifests
        run: node scripts/release-artifacts.mjs verify
      - name: Confirm publication can advance the exact reviewed main
        env:
          MANIFEST_DEPLOY_KEY: ${{ secrets.MANIFEST_DEPLOY_KEY }}
        run: |
          test -n "$MANIFEST_DEPLOY_KEY"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Required model endpoints must be reachable on every host
        run: node scripts/verify-manifests.mjs models --strict
      - uses: ./.github/actions/setup-mc
      - name: Configure object storage
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: mc alias set s3target "https://${MINIO_ENDPOINT}" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null
      - name: Publish into a new version prefix; never overwrite
        run: node scripts/release-artifacts.mjs publish
      - name: Verify every public installer/archive byte before advertising
        run: node scripts/verify-release-downloads.mjs
      - name: Patch complete website manifest from verified artifacts
        run: node scripts/update-release-manifest.mjs
      - name: Commit manifest before website deployment
        # Existing deploy key is the authorized main bypass. Its push triggers
        # the normal website workflow, including that workflow's checks.
        env:
          MANIFEST_DEPLOY_KEY: ${{ secrets.MANIFEST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/manifest-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MANIFEST_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/src/data/releases.ts
          git commit -m "release: v${RELEASE_VERSION} desktop assets"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git push git@github.com:${{ github.repository }}.git HEAD:main
      - name: Record release status
        run: |
          echo "All platform artifacts for v${RELEASE_VERSION} verified and manifest committed." >> "$GITHUB_STEP_SUMMARY"
          echo 'Website deployment runs separately; verify completion before announcing availability.' >> "$GITHUB_STEP_SUMMARY"
