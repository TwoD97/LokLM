name: Checks

# Application checks also run on main; the website deploy does not cover them.
on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Application (types + unit + integration + tx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # postinstall rebuilds better-sqlite3-multiple-ciphers for Electron's ABI
      # (NODE_MODULE_VERSION 146, the packaged app). These suites run under Node
      # (137), and the binding is NAN-based (ABI-locked, unlike N-API argon2), so
      # rebuild it for the Node ABI here — otherwise every DB-backed test fails to
      # load it ("Module did not self-register" / "NODE_MODULE_VERSION 146 vs 137").
      - name: Rebuild better-sqlite3 for the Node test ABI
        run: pnpm rebuild better-sqlite3-multiple-ciphers

      - name: Typecheck application and tests
        run: pnpm typecheck

      - name: Lint application and development tools
        run: pnpm lint

      - name: Unit tests (main, renderer, scripts, installer)
        run: pnpm test:unit

      # Der OCR-Integrationstest (tests/integration/ocr.test.ts) gated sich auf
      # vorhandene tessdata — ohne diesen Download skippt er sich still und die
      # OCR-Pipeline bliebe in CI ungetestet. Fast-Variante, ~5 MB gesamt.
      - name: Download tessdata (OCR-Modelle)
        run: pnpm tessdata

      - name: Integration tests
        run: pnpm test:integration

      - name: TX tests (Schema, Trigger, Funktionen)
        run: pnpm test:tx

  website:
    name: Website (types + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install website deps
        working-directory: website
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Astro check
        working-directory: website
        run: pnpm check

      - name: Build
        working-directory: website
        env:
          PUBLIC_INSTALLER_BASE_URL: https://downloads.loklm.example
        run: pnpm build

      # Static-output tests require this run's build, not an absent/stale dist/.
      - name: Unit tests, built-page smoke checks and coverage
        working-directory: website
        run: pnpm test:coverage

      - name: Install Chromium for browser checks
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium

      # Pixel baselines are Windows-specific; behavioral and accessibility
      # checks run on Linux too. Visual comparisons remain available locally.
      - name: Browser workflows and accessibility
        working-directory: website
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts --grep-invert "visual regression"
