name: Installer checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'installer-wizard/**'
      - '.github/workflows/installer-checks.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - 'scripts/build-whisper-native.mjs'
      - 'scripts/verify-whisper-native.mjs'
      - 'scripts/verify-whisper-linux.mjs'
      - 'scripts/*lancedb*.mjs'
      - 'tests/unit/scripts/*lancedb*'
      - 'scripts/*mac*.mjs'
      - 'scripts/build-installer-stub-linux.mjs'
      - 'tests/unit/scripts/build-installer-stub-linux.test.mjs'
      - 'tests/e2e/packaged-windows.spec.ts'
      - 'src/main/index.ts'
      - 'tests/unit/scripts/*whisper*'
      - 'LICENSE'
  pull_request:
    paths:
      - 'installer-wizard/**'
      - '.github/workflows/installer-checks.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - 'scripts/build-whisper-native.mjs'
      - 'scripts/verify-whisper-native.mjs'
      - 'scripts/verify-whisper-linux.mjs'
      - 'scripts/*lancedb*.mjs'
      - 'tests/unit/scripts/*lancedb*'
      - 'scripts/*mac*.mjs'
      - 'scripts/build-installer-stub-linux.mjs'
      - 'tests/unit/scripts/build-installer-stub-linux.test.mjs'
      - 'tests/e2e/packaged-windows.spec.ts'
      - 'src/main/index.ts'
      - 'tests/unit/scripts/*whisper*'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: installer-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcription-linux:
    name: Native transcription (Ubuntu 22.04 x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install native transcription build tools and Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 libvulkan-dev binutils makeself
      - name: Record and enforce the supported native runtime
        run: |
          getconf GNU_LIBC_VERSION
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64') throw new Error('Native Linux runner architecture mismatch')"
      - name: Install normal application dependencies
        run: pnpm install --frozen-lockfile
      # Do not let the newer Ubuntu application-check runner hide a dependency
      # whose prebuilt binary requires a newer glibc/libstdc++ than our floor.
      - name: Load the native transcription addon on the supported Linux floor
        run: node scripts/verify-whisper-linux.mjs
      - name: Verify native vector storage and persistence
        run: node scripts/verify-lancedb-native.mjs
      - name: Verify temporary installer extraction and cleanup
        run: |
          command -v makeself
          pnpm exec vitest run --project scripts tests/unit/scripts/build-installer-stub-linux.test.mjs

  transcription-mac:
    name: Native transcription (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Require native architecture and build tools
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if (process.platform !== 'darwin' || process.arch !== process.env.EXPECTED_ARCH) throw new Error('Native Mac runner architecture mismatch')"
          xcrun --find clang
          cmake --version
      - uses: dtolnay/rust-toolchain@1.94.0
        if: matrix.arch == 'x64'
        with:
          targets: x86_64-apple-darwin
      - name: Install Intel vector database build prerequisite
        if: matrix.arch == 'x64'
        run: brew install protobuf
      - name: Cache the pinned Intel vector database build
        if: matrix.arch == 'x64'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/native-lancedb
          key: lancedb-mac-x64-v1-${{ hashFiles('scripts/*lancedb*.mjs', 'pnpm-lock.yaml') }}
      # Exercise the normal developer installation, including its fail-closed
      # Mac source build. A release-only repair would leave development broken.
      - name: Install dependencies and build the native Mac binding
        run: pnpm install --frozen-lockfile
      - name: Verify selected architecture, linkage and relocated package import
        run: node scripts/verify-whisper-native.mjs
      - name: Verify native vector storage and persistence
        run: node scripts/verify-lancedb-native.mjs
      - name: Build native packaged Mac app
        run: |
          pnpm exec electron-rebuild -f -o argon2,better-sqlite3-multiple-ciphers
          pnpm tessdata
          pnpm build
          node scripts/build-mac-payloads.mjs ${{ matrix.arch }}
      - name: Verify packaged persistence, restart and shutdown before tagging
        env:
          LOKLM_PACKAGED_EXE: ${{ github.workspace }}/release/mac-${{ matrix.arch }}/LokLM.app/Contents/MacOS/LokLM
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/packaged-windows.spec.ts --retries=0 --reporter=list

  native:
    name: Native installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-wizard/src-tauri
          key: ${{ matrix.os }}
      - name: Test native extraction, update recovery and installer behavior
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked
      - name: Verify GLib iterator backport with release optimizations
        if: runner.os == 'Linux'
        run: cargo test --manifest-path installer-wizard/src-tauri/Cargo.toml --locked --release --test glib_variant_iter
