[package]
name = "loklm-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["storage"]
storage = ["dep:rusqlite", "dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
regex = "=1.13.2"
tempfile = { version = "3", optional = true }
rusqlite = { version = "0.37", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"

