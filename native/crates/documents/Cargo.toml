[package]
name = "loklm-documents"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
loklm-core = { path = "../core", default-features = false }
pdf-extract = "=0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
quick-xml = "=0.42.0"
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
