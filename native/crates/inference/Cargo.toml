[package]
name = "loklm-inference"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
loklm-core = { path = "../core", default-features = false }
llama-cpp-2 = { version = "=0.1.161", default-features = false }
sha2 = "0.10"
hex = "0.4"
encoding_rs = "0.8"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
